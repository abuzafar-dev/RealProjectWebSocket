{% extends 'base.html' %}

{% block title %}Kirish{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-body">
                <h2>Kirish</h2>
                {% if form.non_field_errors %}
                    <div class="alert alert-danger">Login yoki parol xato</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input class="form-control" type="text" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Parol</label>
                        <input class="form-control" type="password" name="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Kirish</button>
                </form>
                <p class="mt-3 mb-0">Akkauntingiz yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'ting</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
